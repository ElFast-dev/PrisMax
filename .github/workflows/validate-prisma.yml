name: Validar Prisma privado

on:
  # Each change to the public runner configuration validates the latest private main.
  push:
    branches: [main]
  # Poll private main hourly because pushes to Prisma cannot start jobs in this public repository.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Rama, etiqueta o SHA del repositorio privado Prisma"
        required: true
        type: string
        default: "main"

permissions:
  contents: read

concurrency:
  group: validar-prisma-privado
  cancel-in-progress: false

jobs:
  validate:
    name: Node.js 22 · sintaxis y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Comprobar que existe el secreto de lectura
        env:
          PRISMA_REPO_TOKEN: ${{ secrets.PRISMA_REPO_TOKEN }}
        run: |
          if [ -z "$PRISMA_REPO_TOKEN" ]; then
            echo "::error::Falta el secreto PRISMA_REPO_TOKEN en ElFast-dev/PrisMax. Debe ser un token con acceso de solo lectura al repositorio privado ElFast-dev/Prisma."
            exit 1
          fi

      - name: Descargar la revisión privada de Prisma
        uses: actions/checkout@v4
        with:
          repository: ElFast-dev/Prisma
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.PRISMA_REPO_TOKEN }}
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Revisar sintaxis
        run: npm run check

      - name: Ejecutar pruebas
        run: npm test

      - name: Comprobar la publicación de producción
        shell: bash
        run: |
          set -euo pipefail
          url="https://prisma-three-omega.vercel.app"
          html="$(curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 2 "$url/")"
          grep -F '<title>Prisma — descubre tu próxima película</title>' <<< "$html"
          grep -F 'Prisma v0.14.9' <<< "$html"
          service_worker="$(curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 2 "$url/sw.js")"
          grep -F 'prisma-shell-v25' <<< "$service_worker"
          echo "Producción responde y sirve Prisma v0.14.9 con shell cache v25."

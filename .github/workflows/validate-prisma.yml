name: Validar Prisma privado

on:
  # Each change to the public runner configuration validates the latest private main.
  push:
    branches: [main]
  # Poll private main hourly because pushes to Prisma cannot start jobs in this public repository.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Rama, etiqueta o SHA del repositorio privado Prisma"
        required: true
        type: string
        default: "main"

permissions:
  contents: read

concurrency:
  group: validar-prisma-privado
  cancel-in-progress: false

jobs:
  validate:
    name: Node.js 22 · sintaxis JS/Python/Bash y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Comprobar que existe el secreto de lectura
        env:
          PRISMA_REPO_TOKEN: ${{ secrets.PRISMA_REPO_TOKEN }}
        run: |
          if [ -z "$PRISMA_REPO_TOKEN" ]; then
            echo "::error::Falta el secreto PRISMA_REPO_TOKEN en ElFast-dev/PrisMax. Debe ser un token con acceso de solo lectura al repositorio privado ElFast-dev/Prisma."
            exit 1
          fi

      - name: Descargar la revisión privada de Prisma
        uses: actions/checkout@v4
        with:
          repository: ElFast-dev/Prisma
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.PRISMA_REPO_TOKEN }}
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias de pruebas
        run: npm install --no-audit --no-fund

      - name: Revisar sintaxis
        run: npm run check

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Instalar Chromium para simulación móvil
        run: npx playwright install --with-deps chromium

      - name: Ejecutar simulador móvil de extremo a extremo
        run: npm run test:browser

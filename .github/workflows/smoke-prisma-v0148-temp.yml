name: Smoke HTTP Prisma v0.14.8 (temporal)

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: smoke-prisma-v0148-temporal
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar home y service worker de producción
        shell: bash
        run: |
          set +e
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 \
            --output /tmp/prisma-home.html --write-out '%{http_code}' \
            https://prisma-three-omega.vercel.app/ > /tmp/prisma-home-status.txt
          home_exit=$?
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 \
            --output /tmp/prisma-sw.js --write-out '%{http_code}' \
            https://prisma-three-omega.vercel.app/sw.js > /tmp/prisma-sw-status.txt
          sw_exit=$?
          if [ "$home_exit" -eq 0 ]; then
            grep -F '<title>Prisma — descubre tu próxima película</title>' /tmp/prisma-home.html >/dev/null
            title_match=$?
            grep -F 'Prisma v0.14.8' /tmp/prisma-home.html >/dev/null
            version_match=$?
          else
            title_match=1
            version_match=1
          fi
          if [ "$sw_exit" -eq 0 ]; then
            grep -F 'prisma-shell-v24' /tmp/prisma-sw.js >/dev/null
            shell_match=$?
          else
            shell_match=1
          fi
          {
            echo "url=https://prisma-three-omega.vercel.app/"
            echo "home_http_status=$(cat /tmp/prisma-home-status.txt 2>/dev/null)"
            echo "home_curl_exit=$home_exit"
            echo "title_match=$title_match"
            echo "version_match=$version_match"
            echo "sw_http_status=$(cat /tmp/prisma-sw-status.txt 2>/dev/null)"
            echo "sw_curl_exit=$sw_exit"
            echo "shell_match=$shell_match"
          } > /tmp/prisma-v0148-smoke-report.txt
          cat /tmp/prisma-v0148-smoke-report.txt

      - name: Publicar solo el resultado agregado
        if: always()
        uses: actions/checkout@v4
        with:
          repository: ElFast-dev/PrisMax
          ref: main
          token: ${{ github.token }}
          path: runner-results
          persist-credentials: true

      - name: Guardar resumen de smoke sin contenido de la página
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd runner-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B test-results/prisma-v0-14-8-smoke
          mkdir -p validation-results
          cp /tmp/prisma-v0148-smoke-report.txt validation-results/prisma-v0-14-8-smoke.txt
          git add validation-results/prisma-v0-14-8-smoke.txt
          git commit -m "Registra resultado temporal del smoke de Prisma v0.14.8" || true
          git push --force origin test-results/prisma-v0-14-8-smoke

      - name: Verificar resultado
        if: always()
        shell: bash
        run: |
          grep -q '^home_curl_exit=0$' /tmp/prisma-v0148-smoke-report.txt
          grep -q '^title_match=0$' /tmp/prisma-v0148-smoke-report.txt
          grep -q '^version_match=0$' /tmp/prisma-v0148-smoke-report.txt
          grep -q '^sw_curl_exit=0$' /tmp/prisma-v0148-smoke-report.txt
          grep -q '^shell_match=0$' /tmp/prisma-v0148-smoke-report.txt
